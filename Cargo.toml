[package]
name = "cics-tx"
version = "0.1.0"
edition = "2021"
description = "A from-scratch, Berkeley-DB-family embedded transactional store, wrapped in a CICS-style transaction-processing runtime (Task/Program/File Control + SYNCPOINT)."

[lib]
name = "cics_tx"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1"
parking_lot = "0.12"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "bank_demo"
path = "examples/bank_demo.rs"
